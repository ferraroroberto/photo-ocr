<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Photo OCR">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/static/icon-180.png">
  <link rel="icon" href="/static/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/static/icon-512.png">
  <link rel="stylesheet" href="/static/styles.css">
  <title>📷 Photo OCR</title>
</head>
<body>
  <main class="app">
    <header class="header">
      <h1>📷 Photo OCR</h1>
      <div class="header-actions">
        <button id="resetBtn" type="button" class="header-icon-btn" title="Reset — clear photos and result" aria-label="Reset">🧽</button>
        <label class="incognito-btn" title="Incognito — don't save this take to history">
          <input id="incognitoToggle" type="checkbox" hidden>
          <span class="icon">🕵️</span>
        </label>
      </div>
    </header>

    <section class="capture-zone">
      <ul id="thumbStrip" class="thumb-strip" aria-label="Photos in this take"></ul>

      <div class="capture-actions">
        <label class="big-btn add-photo-btn" for="cameraInput">
          📷 Add photo
        </label>
        <label class="ghost-btn gallery-btn" for="galleryInput" title="Pick from gallery instead of camera">
          🖼️
        </label>
      </div>
      <input id="cameraInput" type="file" accept="image/*" capture="environment" multiple hidden>
      <input id="galleryInput" type="file" accept="image/*" multiple hidden>

      <button id="extractBtn" type="button" class="big-btn extract-btn" disabled>
        🔍 Extract text
      </button>
      <div id="captureStatus" class="record-status">Add a photo to begin</div>
    </section>

    <section class="card extracted-card">
      <div class="card-header">
        <h2>📝 Extracted text</h2>
        <div class="row card-header-actions">
          <button id="copyExtracted" class="copy-btn" type="button" disabled>📋 Copy</button>
        </div>
      </div>
      <textarea id="extracted" class="text-out editable" placeholder="Tap Extract — the text from your photos will appear here, deduplicated and copy-ready." rows="6"></textarea>
    </section>

    <details id="settingsPanel" class="card settings-card">
      <summary>⚙️ Settings</summary>
      <label class="row">
        <span>Model</span>
        <select id="ocrModel" class="select-native"></select>
      </label>
      <label class="row">
        <span>Style</span>
        <select id="ocrStyle" class="select-native"></select>
      </label>
      <label class="stacked">
        <span class="muted small">Prompt sent to the LLM (read-only preview)</span>
        <textarea id="ocrPromptPreview" class="text-out prompt-preview" rows="6" readonly></textarea>
      </label>
      <label class="row">
        <span>Auto-clean older than (days)</span>
        <input id="retentionDays" type="number" min="1" max="365" class="input-native">
      </label>
      <label class="row">
        <span>Max photos per take</span>
        <input id="maxPhotos" type="number" min="1" max="100" class="input-native">
      </label>
      <div class="row">
        <button id="saveSettings" type="button" class="big-btn">💾 Save defaults</button>
      </div>
      <hr>
      <p class="muted small">
        First time on iPhone? Install the trust profile:
        <a href="/install-ca">/install-ca</a>
      </p>
      <p id="statusReadout" class="muted small"></p>
      <p id="buildInfo" class="muted small" title="Which build of the webapp this device loaded — see issue #5">Build: …</p>
    </details>

    <details class="card history-card" open>
      <summary>📜 History (<span id="historyCount">0</span>)</summary>
      <div class="history-actions">
        <button id="refreshHistory" type="button" class="ghost-btn">🔄 Refresh</button>
        <button id="cleanAll" type="button" class="ghost-btn">🗑️ Clean</button>
      </div>
      <ul id="historyList" class="history-list"></ul>
      <button id="loadMoreHistory" type="button" class="ghost-btn load-more-btn" hidden>📥 Load more</button>
    </details>

    <div id="toast" class="toast" hidden></div>
  </main>

  <dialog id="previewDialog" class="preview-dialog">
    <button id="previewClose" type="button" class="preview-close" aria-label="Close preview">✕</button>
    <img id="previewImg" class="preview-img" alt="Photo preview">
  </dialog>

  <div id="loginOverlay" class="login-overlay" hidden>
    <form id="loginForm" class="login-card" autocomplete="off">
      <h2>🔐 Sign in</h2>
      <p class="muted small">Enter the password to use this photo OCR app.</p>
      <input
        id="loginPassword"
        type="password"
        autocomplete="current-password"
        placeholder="Password"
        required
      >
      <button type="submit" class="big-btn">Unlock</button>
      <div id="loginError" class="login-error" hidden></div>
    </form>
  </div>

  <script type="module" src="/static/main.js"></script>
</body>
</html>
