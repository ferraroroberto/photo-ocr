# [static_ratchet] -- the scaffold's baseline-and-ratchet static analysis. The gate
# (scripts/verify-before-ship.ps1) runs scripts/static_ratchet_gate.py, which wraps
# scripts/static_ratchet.py: it fails on a duplicate block (jscpd via npx, Python
# and JS), an unused import/variable (ruff F401,F841) or a ruff bug (B) / security
# (S) finding from the scaffold's curated set (S113 strict) that is not in
# .static-ratchet-baseline.json. Needs Node and ruff in the gate's venv; a detector
# that cannot run exits 3, which fails the gate. Vendored copies are duplicates by
# design, so they are excluded. Procedure + limits: project-scaffolding
# docs/static-ratchet.md.
self_restart = { src = "src/self_restart.py", sha = "48602060fffdacbcdcdde66b9886c6471d835ff3", dest = "src/self_restart.py" }
build_info = { src = "src/build_info.py", sha = "1c1007fcd0b65b54342779250cb66975d57482e8", dest = "src/build_info.py" }
health_routes = { src = "src/health_routes.py", sha = "732c304a4735d4e654f5acb3b6f53b7db67d47ef", dest = "src/health_routes.py" }
restart_check = { src = "src/restart_check.py", sha = "f8c2f66eae7a69f3c834386579702ed5b747d7af", dest = "src/restart_check.py" }
ratchet_baseline = { src = "scripts/ratchet_baseline.py", sha = "48db2132dab2dfc38b6154948ca17fd1f4b9232f", dest = "scripts/ratchet_baseline.py" }
personal_data_ratchet = { src = "scripts/personal_data_ratchet.py", sha = "f911e1c5adc679fee1522e748d9f4fc4c140561d", dest = "scripts/personal_data_ratchet.py" }

[static_ratchet]
enabled  = true
baseline = ".ratchets/static.json"
exclude  = ["**/_vendored/**"]

# [docs_ratchet] -- the scaffold's baseline-and-ratchet on docs hygiene. The gate
# (scripts/verify-before-ship.ps1) runs scripts/docs_ratchet_gate.py, which wraps
# scripts/docs_ratchet.py: it fails when the root README.md grows past 40 KiB or
# past its baselined size, or when README.md or docs/**/*.md gains a history marker
# (an issue reference, a dated heading, a changelog heading) beyond
# .docs-ratchet-baseline.json. Docs state the present-tense why; history lives in
# git, PRs and issues. A doc that cannot be read exits 3, which fails the gate.
# No exclude: docs/ holds no generated or dated report folder. Procedure +
# limits: project-scaffolding docs/docs-ratchet.md.
[docs_ratchet]
enabled  = true
baseline = ".ratchets/docs.json"

# [structure_ratchet] -- the scaffold's baseline-and-ratchet on repo structure. The gate
# (scripts/verify-before-ship.ps1) runs scripts/structure_ratchet.py: it fails when a
# file passes 1,000 lines, a Python/JS function 100 lines, a directory 40 modules, or a
# src/ module imports app/, beyond .structure-ratchet-baseline.json, or when a tracked
# root folder is outside the `shape` preset and `extra_roots` above (never baselined;
# docs/layout.md says why each exception stays). Stdlib only. A file that cannot be
# measured exits 3, which fails the gate. Vendored copies are excluded by the script
# itself. Procedure + limits: project-scaffolding docs/structure-ratchet.md.
[structure_ratchet]
enabled  = true
baseline = ".ratchets/structure.json"

# [conventions_ratchet] -- the scaffold's baseline-and-ratchet on fleet conventions held as
# stdlib ast rules. The gate (scripts/verify-before-ship.ps1) runs
# scripts/conventions_ratchet.py: it fails when a file's hit count for an enabled rule
# rises above .conventions-ratchet-baseline.json. no-window: this app runs on Windows
# with no console of its own (tray, webapp), so an unsuppressed spawn flashes a window.
# logging-not-print: app/ and src/ are library code. no-drive-path: no hardcoded drive
# locations. login-lockout: the password route goes through the vendored src/login_lockout.py.
# password-input-vendored: the only password input lives in the vendored sign-in
# sheet. secret-compare and git-wrapper stay off: the repo has no helper for either.
# A file that cannot be parsed exits 3, which fails the gate. Vendored copies are skipped
# by the script itself. Procedure + limits: project-scaffolding docs/conventions-ratchet.md.
[conventions_ratchet]
enabled  = true
baseline = ".ratchets/conventions.json"
rules    = ["no-window", "logging-not-print", "no-drive-path", "password-input-vendored", "nav-standalone-head", "login-lockout", "no-pwsh-stub", "subprocess-timeout", "browser-per-iteration", "state-literal", "state-set-repeat", "state-write", "path-sep"]

# A SQLite connection is opened in one module: the search index owns it.
[[conventions_ratchet.must_use]]
call   = "sqlite3.connect"
helper = ["src/archive_index.py"]
why    = "the search index module is the only place that opens a SQLite connection"
paths  = ["app/", "src/"]

# Outbound HTTP rides a pooled `requests.Session`, never a bare verb call that opens a fresh connection.
[[conventions_ratchet.must_use]]
call   = ["requests.get", "requests.post", "requests.put", "requests.patch", "requests.delete", "requests.head", "requests.request"]
helper = ["src/ocr_client.py", "app/webapp/manager.py"]
why    = "the two modules that talk to another process each own one pooled requests.Session"
paths  = ["app/", "src/"]


# [runtime_write_ratchet] -- scripts/runtime_write_ratchet.py fails when a tracked
# Python file gains a write target (open for writing, Path.write_*, mkdir, a log
# FileHandler, sqlite3.connect, a copy destination) whose path resolves under a code
# folder, beyond .runtime-write-ratchet-baseline.json; a new target it cannot resolve
# is "not confirmed" (exit 3), never clean. The same script brackets the test stages
# (--snapshot before, --probe after) and fails on any untracked or ignored file the
# run left under a code folder. Mechanism: project-scaffolding docs/runtime-write-ratchet.md.
[runtime_write_ratchet]
enabled  = true
baseline = ".ratchets/runtime-write.json"

# [usage_track_ratchet] -- scripts/usage_track_ratchet.py (with its reader
# scripts/usage_track_scan.py) fails when the web app's HTML or JS gains a control with no
# constant `data-track` id, a <dialog> with no `data-track-view`, or a tracking id built at
# run time, beyond .usage-track-ratchet-baseline.json; `usage-log-wired` also fails, never
# baselined, when the app does not vendor, start and mount its usage log. Exit 3 is "not
# confirmed", never clean. Mechanism: project-scaffolding docs/usage-track-ratchet.md.
[usage_track_ratchet]
enabled  = true
baseline = ".ratchets/usage-track.json"
rules    = ["untracked-control", "untracked-sheet", "dynamic-id", "usage-log-wired", "health-routes-wired"]
# Callers of these pass a constant `track:` id; the builder stamps it on the dialog and its buttons.
builders = ["app/webapp/static/sheet.js:openSheet", "app/webapp/static/sheet.js:confirmSheet"]

# [ux_surface_ratchet] -- scripts/ux_surface_ratchet.py fails when the web app's HTML or JS gains a
# surface root (a <dialog>, a dialog/menu/tabpanel role, a popover) with no constant
# `data-surface` id, an id with no entry in docs/ux-surfaces.yaml, a map entry no element
# carries, one id on two surfaces, a link to an id with no entry, or a docs/ux-surface-map.md page
# not regenerated from the map, beyond .ux-surface-ratchet-baseline.json. Exit 3 is
# "not confirmed", never clean. Every secondary sheet is built by sheet.js, whose call sites
# stamp their own constant id. Mechanism: project-scaffolding docs/ux-surface-ratchet.md.
[ux_surface_ratchet]
enabled  = true
baseline = ".ratchets/ux-surface.json"
map      = "docs/ux-surfaces.yaml"

# [comment_ratchet] -- the scaffold's baseline-and-ratchet on issue references in comments. The gate
# (scripts/verify-before-ship.ps1) runs scripts/comment_ratchet.py: it fails when a file's
# count of #NNN references inside product-code comments (.py, .js, .css, .ps1) rises above
# .comment-ratchet-baseline.json. A comment states the present-tense why; history lives in
# the issue, the PR and git log. Tests are out of scope. _vendored/ is excluded because it
# holds byte-identical scaffold copies. A file that cannot be scanned exits 3, which fails
# the gate.
# Procedure + limits: project-scaffolding docs/comment-ratchet.md.
[comment_ratchet]
enabled  = true
baseline = ".ratchets/comment.json"
docstrings      = true
history_phrases = true
include  = ["app/", "src/", "scripts/"]
exclude  = ["**/_vendored/**"]

# [instruction_ratchet] -- the scaffold's baseline-and-ratchet on the lint-tier rules of the
# fleet prompt audit, run over this repo's instruction files (CLAUDE.md, AGENTS.md). The gate
# (scripts/verify-before-ship.ps1) runs scripts/instruction_ratchet.py: it fails when a file's
# count for a rule rises above .instruction-ratchet-baseline.json, or a file passes its size
# cap. The repo ships no skills or rules folder, so skill_dirs is empty. A file it cannot read
# exits 3, which fails the gate. Procedure + limits: project-scaffolding
# docs/instruction-ratchet.md.
[instruction_ratchet]
enabled     = true
baseline    = ".ratchets/instruction.json"
skill_dirs  = []
ci_expectations = true
agents_pointer = true
repeated_text_words = 12
claude_md_max_lines = 120

# [doc_refs_ratchet] -- the scaffold's baseline-and-ratchet on stale references in docs. The gate
# (scripts/verify-before-ship.ps1) runs scripts/doc_refs_ratchet.py: it reads README.md,
# CLAUDE.md and docs/**/*.md, resolves every repo path, python -m module and loopback port
# against the tracked tree and this file, and fails on a dangling one that
# .doc-refs-ratchet-baseline.json does not record. allow_refs lists the ports of the other
# services the docs name: :8000 is the local LLM hub, :9221 the iOS WebKit debug proxy
# (docs/iphone-debugging.md). Procedure + limits: project-scaffolding docs/doc-refs-ratchet.md.
[doc_refs_ratchet]
enabled    = true
trees    = true
baseline   = ".ratchets/doc-refs.json"
allow_refs = [":8000", ":9221"]

# [dead_code_ratchet] -- the scaffold's baseline-and-ratchet on Python definitions nothing names.
# The gate (scripts/verify-before-ship.ps1) runs scripts/dead_code_ratchet.py: it fails on an
# unused function, class or variable in app/ and src/ that .dead-code-ratchet-baseline.json does
# not record. A name another file, a string or a non-Python source mentions counts as used.
# Procedure + limits: project-scaffolding docs/dead-code-ratchet.md.
[dead_code_ratchet]
enabled  = true
baseline = ".ratchets/dead-code.json"
include  = ["app/", "src/"]

# /design-sync verdicts the repo accepts (skills/_lib/design_lint/accepted.py).
# `detail` pins the exact lint message, so a second off-scale row raises the
# finding again.
[[design.accepted]]
check  = "row-height-scale"
detail = "row/action-rail heights outside the 44px, 52px, 60px scale: 48pxx1"
reason = "toolbar row sized to the 48px buttons at styles.css:542"
record = "https://github.com/ferraroroberto/photo-ocr/issues/214"

# /perf-review (fleet-config skills/perf-review): "ready" is the empty take's
# primary start, "Choose photos", visible on the Capture tab (the phone's
# landing view), not first contentful paint. Capture has no card that waits
# on live data (config and history only fill the Settings and History panes),
# so the affordance the user needs to start a take is the honest ready signal.
[perf.review]
ready_selector = ".choose-photos-btn"

# /design-review's e2e capture (tests/e2e/_surface.py) flips light/dark in place on an open
# surface; this app stamps html[data-theme] at load from photo-ocr.theme (else the OS
# scheme), so the hook has to set that key too or its dark shots stay light.
[design.review]
theme_storage_key = "photo-ocr.theme"

# `measure --e2e` and `--synthetic` walk this throwaway webapp (empty History, temp
# data dir), never the live tray on :8444 (scripts/design_review_synthetic.py).
[design.review.synthetic]
command = ["scripts/design_review_synthetic.py"]
startup_timeout_s = 60

# The Mac Mini nightly (project-scaffolding docs/mac-runner.md, "The [ci.nightly]
# table"): a fresh .venv from the two requirements files, the committed config
# samples seeded, the unit suite without the windows_only tests, the e2e suite on
# the iPhone WebKit projection, and the simulator smoke of "/" against the
# throwaway instance [design.review.synthetic] declares. The Windows pre-ship gate
# stays the contract and keeps running every test.
[ci.nightly]
python       = "3.14"
requirements = ["requirements.txt", "requirements-dev.txt"]
samples      = "config"
unit         = ["tests", "--ignore=tests/e2e"]
e2e          = ["tests/e2e", "--e2e-autoboot"]
views        = ["/"]

# Diff-proportionate e2e routing (project-scaffolding docs/e2e-routing.md).
# `scripts/classify_e2e.py` maps this branch's changed files to a tier; rules
# are tried in declaration order, first match wins. Only plainly inert paths
# get a "none" rule -- anything unmatched fail-safes to the full suite by
# construction, so leaving a path out is always the safe choice. Keep this
# table current in the same PR as any new e2e-relevant directory, and mirror
# each rule with a representative assertion in tests/test_classify_e2e.py.
[e2e]
static_pytest_target = "tests/e2e/test_smoke.py"
static_browsers = ["chromium"]
full_pytest_target = "tests/e2e"
# JUnit XML the pre-ship gate writes (timing source for /e2e-audit).
junit_xml = "webapp/e2e-junit.xml"

# --- inert: no browser surface at all -------------------------------------
[[e2e.rule]]
tier = "none"
prefix = "docs/"
label = "docs"

[[e2e.rule]]
tier = "none"
extensions = ["md"]
label = "markdown"

[[e2e.rule]]
tier = "none"
path = "LICENSE"
label = "license"

# The ratchet baseline is data for scripts/static_ratchet.py, not a browser surface.
[[e2e.rule]]
tier = "none"
path = ".ratchets/static.json"
label = "static-ratchet-baseline"

# Likewise data for scripts/docs_ratchet.py.
[[e2e.rule]]
tier = "none"
path = ".ratchets/docs.json"
label = "docs-ratchet-baseline"

# Likewise data for scripts/structure_ratchet.py.
[[e2e.rule]]
tier = "none"
path = ".ratchets/structure.json"
label = "structure-ratchet-baseline"

# Likewise data for scripts/conventions_ratchet.py.
[[e2e.rule]]
tier = "none"
path = ".ratchets/conventions.json"
[[e2e.rule]]
tier = "none"
path = ".ratchets/runtime-write.json"
[[e2e.rule]]
tier = "none"
path = ".ratchets/usage-track.json"
label = "conventions-ratchet-baseline"

# Likewise data for scripts/ux_surface_ratchet.py.
[[e2e.rule]]
tier = "none"
path = ".ratchets/ux-surface.json"
label = "ux-surface-ratchet-baseline"

# Likewise data for scripts/comment_ratchet.py.
[[e2e.rule]]
tier = "none"
path = ".ratchets/comment.json"
label = "comment-ratchet-baseline"

# Likewise data for scripts/instruction_ratchet.py.
[[e2e.rule]]
tier = "none"
path = ".ratchets/instruction.json"
label = "instruction-ratchet-baseline"

# Likewise data for scripts/doc_refs_ratchet.py.
[[e2e.rule]]
tier = "none"
path = ".ratchets/doc-refs.json"
label = "doc-refs-ratchet-baseline"

# Likewise data for scripts/dead_code_ratchet.py.
[[e2e.rule]]
tier = "none"
path = ".ratchets/dead-code.json"
label = "dead-code-ratchet-baseline"

# Desktop tray / Stream Deck icons -- never served to the browser.
[[e2e.rule]]
tier = "none"
prefix = "assets/"
label = "desktop-assets"

# --- narrow: served image assets, smoke slice is enough --------------------
[[e2e.rule]]
tier = "static"
prefix = "app/webapp/static/"
extensions = ["png", "ico", "jpg", "jpeg", "webp", "gif", "svg"]
label = "static-images"

# --- full: the rendered PWA and the modules behind it ----------------------
[[e2e.rule]]
tier = "full"
prefix = "app/webapp/"
label = "webapp"

[[e2e.rule]]
tier = "full"
prefix = "src/"
label = "webapp-facing-src"

# [request_budget_ratchet] -- the scaffold's baseline-and-ratchet on request budget. The gate
# (scripts/verify-before-ship.ps1) runs scripts/request_budget_ratchet.py: it fails when a file's
# count of fixed-rate polls that reach the server, polls under the 2 s floor, fast or unfixed
# server loops, directory scans in request handlers, default-pool submissions or a missing
# timing middleware rises above .request-budget-ratchet-baseline.json. Exit 3 (a file that cannot
# be read, JS that never closes, Python that does not parse) is its own failure, never a pass.
# Procedure + limits: project-scaffolding docs/request-budget-ratchet.md.
# What the main page may send in a visible minute on the frozen-clock probe
# (tests/e2e/test_request_budget.py). Measured: 1, the usage log's one batched
# send of the boot events; the page has no poll, so any further request is a regression.
[request_budget]
visible_requests_per_minute = 1

[request_budget_ratchet]
enabled      = true
handler_dirs = ["app/webapp/routers"]

# The one server loop: it runs only while the tray is starting the webapp, ends at
# startup_timeout_seconds (15 s) or on the first healthy answer, and is never
# reached by a request.
[[request_budget.loops]]
path       = "app/webapp/manager.py"
function   = "WebappManager._wait_until_ready"
interval_s = 0.4
why        = "bounded startup wait: polls the child's loopback health until it answers or 15 s pass, run once per launch by the tray and never while serving"

# [windows_only_ratchet] -- the scaffold's baseline-and-ratchet on unmarked Windows-only tests. The gate
# (scripts/verify-before-ship.ps1) runs scripts/windows_only_ratchet.py: it fails when a test module
# gains a test that touches a Windows-only API (module, attribute, environment variable or planted
# .exe lookup) without the windows_only marker the Mac nightly deselects, beyond
# .windows-only-ratchet-baseline.json. Exit 3 (git unusable, a test module that cannot be read or
# parsed) is its own failure, never a pass. Procedure + limits: project-scaffolding
# docs/windows-only-ratchet.md.
[windows_only_ratchet]
enabled    = true
baseline   = ".ratchets/windows-only.json"
marker     = "windows_only"
test_paths = ["tests/**"]
