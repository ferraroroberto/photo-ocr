# .fleet.toml — this repo's card on the fleet architecture map.
# fleet-config's /system-map aggregates every repo's .fleet.toml. Keep current:
# update in the same PR as any material change (layer, port, role, one-line
# description, exposed services). Schema: fleet-config/architecture/README.md.
layer       = "enabling"
icon        = "📷"
port        = ":8444"
description = "Mobile OCR — photos → clean text. Reusable capture surface."

[vendored]
e2e_live_guard = { src = "tests/e2e/_e2e_live_guard.py", sha = "727dfe8b9e4e625993c0e0286836e510015411cc", dest = "tests/e2e/_e2e_live_guard.py" }
runtime_data = { src = "src/runtime_data.py", sha = "346765f7c14af0ec61e960333c055974e4e9e1db", dest = "src/runtime_data.py" }
classify_e2e = { src = "scripts/classify_e2e.py", sha = "bede95f00aee0b17d5007246a29fa881a71f24f4", dest = "scripts/classify_e2e.py" }
nav = { src = "app/webapp/static/_vendored/nav", sha = "56e76aa373c6cb689b100f1ce14aa8171d872085", dest = "app/webapp/static/_vendored/nav" }

# /perf-review (fleet-config skills/perf-review): "ready" is the primary
# "Add photo" button visible on the Capture tab (the phone's landing view),
# not first contentful paint. Capture has no card that waits on live data
# (config and history only fill the Settings and History panes), so the
# affordance the user needs to start a take is the honest ready signal.
[perf.review]
ready_selector = ".add-photo-btn"

# Diff-proportionate e2e routing (project-scaffolding docs/e2e-routing.md).
# `scripts/classify_e2e.py` maps this branch's changed files to a tier; rules
# are tried in declaration order, first match wins. Only plainly inert paths
# get a "none" rule -- anything unmatched fail-safes to the full suite by
# construction, so leaving a path out is always the safe choice. Keep this
# table current in the same PR as any new e2e-relevant directory, and mirror
# each rule with a representative assertion in tests/test_classify_e2e.py.
[e2e]
static_pytest_target = "tests/e2e/test_smoke.py"
static_browsers = ["chromium"]
full_pytest_target = "tests/e2e"
# JUnit XML the pre-ship gate writes (timing source for /e2e-audit).
junit_xml = "webapp/e2e-junit.xml"

# --- inert: no browser surface at all -------------------------------------
[[e2e.rule]]
tier = "none"
prefix = "docs/"
label = "docs"

[[e2e.rule]]
tier = "none"
extensions = ["md"]
label = "markdown"

[[e2e.rule]]
tier = "none"
path = "LICENSE"
label = "license"

# Desktop tray / Stream Deck icons -- never served to the browser.
[[e2e.rule]]
tier = "none"
prefix = "assets/"
label = "desktop-assets"

# --- narrow: served image assets, smoke slice is enough --------------------
[[e2e.rule]]
tier = "static"
prefix = "app/webapp/static/"
extensions = ["png", "ico", "jpg", "jpeg", "webp", "gif", "svg"]
label = "static-images"

# --- full: the rendered PWA and the modules behind it ----------------------
[[e2e.rule]]
tier = "full"
prefix = "app/webapp/"
label = "webapp"

[[e2e.rule]]
tier = "full"
prefix = "src/"
label = "webapp-facing-src"
