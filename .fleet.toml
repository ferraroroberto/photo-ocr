# [static_ratchet] -- the scaffold's baseline-and-ratchet static analysis. The gate
# (scripts/verify-before-ship.ps1) runs scripts/static_ratchet_gate.py, which wraps
# scripts/static_ratchet.py: it fails on a duplicate block (jscpd via npx, Python
# and JS) or an unused import/variable (ruff F401,F841) that is not in
# .static-ratchet-baseline.json. Needs Node and ruff in the gate's venv; a detector
# that cannot run exits 3, which fails the gate. Vendored copies are duplicates by
# design, so they are excluded. Procedure + limits: project-scaffolding
# docs/static-ratchet.md.
[static_ratchet]
enabled  = true
baseline = ".static-ratchet-baseline.json"
exclude  = ["**/_vendored/**"]

# [docs_ratchet] -- the scaffold's baseline-and-ratchet on docs hygiene. The gate
# (scripts/verify-before-ship.ps1) runs scripts/docs_ratchet_gate.py, which wraps
# scripts/docs_ratchet.py: it fails when the root README.md grows past 40 KiB or
# past its baselined size, or when README.md or docs/**/*.md gains a history marker
# (an issue reference, a dated heading, a changelog heading) beyond
# .docs-ratchet-baseline.json. Docs state the present-tense why; history lives in
# git, PRs and issues. A doc that cannot be read exits 3, which fails the gate.
# No exclude: docs/ holds no generated or dated report folder. Procedure +
# limits: project-scaffolding docs/docs-ratchet.md.
[docs_ratchet]
enabled  = true
baseline = ".docs-ratchet-baseline.json"

# [structure_ratchet] -- the scaffold's baseline-and-ratchet on repo structure. The gate
# (scripts/verify-before-ship.ps1) runs scripts/structure_ratchet.py: it fails when a
# file passes 1,000 lines, a Python/JS function 100 lines, a directory 40 modules, or a
# src/ module imports app/, beyond .structure-ratchet-baseline.json, or when a tracked
# root folder is outside the `shape` preset and `extra_roots` above (never baselined;
# docs/layout.md says why each exception stays). Stdlib only. A file that cannot be
# measured exits 3, which fails the gate. Vendored copies are excluded by the script
# itself. Procedure + limits: project-scaffolding docs/structure-ratchet.md.
[structure_ratchet]
enabled  = true
baseline = ".structure-ratchet-baseline.json"

# /design-sync verdicts the repo accepts (skills/_lib/design_lint/accepted.py).
# `detail` pins the exact lint message, so a second off-scale row raises the
# finding again.
[[design.accepted]]
check  = "row-height-scale"
detail = "row/action-rail heights outside the 44px, 52px, 60px scale: 48pxx1"
reason = "toolbar row sized to the 48px buttons at styles.css:542"
record = "https://github.com/ferraroroberto/photo-ocr/issues/214"

# /perf-review (fleet-config skills/perf-review): "ready" is the empty take's
# primary start, "Choose photos", visible on the Capture tab (the phone's
# landing view), not first contentful paint. Capture has no card that waits
# on live data (config and history only fill the Settings and History panes),
# so the affordance the user needs to start a take is the honest ready signal.
[perf.review]
ready_selector = ".choose-photos-btn"

# /design-review's e2e capture (tests/e2e/_surface.py) flips light/dark in place on an open
# surface; this app stamps html[data-theme] at load from photo-ocr.theme (else the OS
# scheme), so the hook has to set that key too or its dark shots stay light.
[design.review]
theme_storage_key = "photo-ocr.theme"

# `measure --e2e` and `--synthetic` walk this throwaway webapp (empty History, temp
# data dir), never the live tray on :8444 (scripts/design_review_synthetic.py).
[design.review.synthetic]
command = ["scripts/design_review_synthetic.py"]
startup_timeout_s = 60

# Diff-proportionate e2e routing (project-scaffolding docs/e2e-routing.md).
# `scripts/classify_e2e.py` maps this branch's changed files to a tier; rules
# are tried in declaration order, first match wins. Only plainly inert paths
# get a "none" rule -- anything unmatched fail-safes to the full suite by
# construction, so leaving a path out is always the safe choice. Keep this
# table current in the same PR as any new e2e-relevant directory, and mirror
# each rule with a representative assertion in tests/test_classify_e2e.py.
[e2e]
static_pytest_target = "tests/e2e/test_smoke.py"
static_browsers = ["chromium"]
full_pytest_target = "tests/e2e"
# JUnit XML the pre-ship gate writes (timing source for /e2e-audit).
junit_xml = "webapp/e2e-junit.xml"

# --- inert: no browser surface at all -------------------------------------
[[e2e.rule]]
tier = "none"
prefix = "docs/"
label = "docs"

[[e2e.rule]]
tier = "none"
extensions = ["md"]
label = "markdown"

[[e2e.rule]]
tier = "none"
path = "LICENSE"
label = "license"

# The ratchet baseline is data for scripts/static_ratchet.py, not a browser surface.
[[e2e.rule]]
tier = "none"
path = ".static-ratchet-baseline.json"
label = "static-ratchet-baseline"

# Likewise data for scripts/docs_ratchet.py.
[[e2e.rule]]
tier = "none"
path = ".docs-ratchet-baseline.json"
label = "docs-ratchet-baseline"

# Likewise data for scripts/structure_ratchet.py.
[[e2e.rule]]
tier = "none"
path = ".structure-ratchet-baseline.json"
label = "structure-ratchet-baseline"

# Desktop tray / Stream Deck icons -- never served to the browser.
[[e2e.rule]]
tier = "none"
prefix = "assets/"
label = "desktop-assets"

# --- narrow: served image assets, smoke slice is enough --------------------
[[e2e.rule]]
tier = "static"
prefix = "app/webapp/static/"
extensions = ["png", "ico", "jpg", "jpeg", "webp", "gif", "svg"]
label = "static-images"

# --- full: the rendered PWA and the modules behind it ----------------------
[[e2e.rule]]
tier = "full"
prefix = "app/webapp/"
label = "webapp"

[[e2e.rule]]
tier = "full"
prefix = "src/"
label = "webapp-facing-src"
