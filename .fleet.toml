# .fleet.toml — this repo's card on the fleet architecture map.
# fleet-config's /system-map aggregates every repo's .fleet.toml. Keep current:
# update in the same PR as any material change (layer, port, role, one-line
# description, exposed services). Schema: fleet-config/architecture/README.md.
layer       = "enabling"
icon        = "📷"
port        = ":8444"
description = "Mobile OCR — photos → clean text. Reusable capture surface."
depends_on  = ["local-llm-hub", "project-scaffolding"]
shape       = "webapp-tray"
extra_roots = []

# The extraction phase of a take, declared once (docs/extract-phase-state.md).
[[state_machines]]
name   = "extract-phase"
module = "src/extract_state.py"
type   = "ExtractPhase"
derive = "derive_extract_phase"

# The same phases as the client reads them (docs/extract-phase-state.md).
[[state_machines]]
name   = "extract-phase-client"
module = "app/webapp/static/extract_phase.js"
type   = "ExtractPhase"
derive = "deriveExtractPhase"

# One photo's upload in the Capture strip (docs/photo-upload-state.md).
[[state_machines]]
name   = "photo-upload"
module = "app/webapp/static/photo_state.js"
type   = "PhotoStatus"
derive = "derivePhotoStatus"

