# [static_ratchet] -- the scaffold's baseline-and-ratchet static analysis. The gate
# (scripts/verify-before-ship.ps1) runs scripts/static_ratchet_gate.py, which wraps
# scripts/static_ratchet.py: it fails on a duplicate block (jscpd via npx, Python
# and JS), an unused import/variable (ruff F401,F841) or a ruff bug (B) / security
# (S) finding from the scaffold's curated set (S113 strict) that is not in
# .static-ratchet-baseline.json. Needs Node and ruff in the gate's venv; a detector
# that cannot run exits 3, which fails the gate. Vendored copies are duplicates by
# design, so they are excluded. Procedure + limits: project-scaffolding
# docs/static-ratchet.md.
[static_ratchet]
enabled  = true
baseline = ".static-ratchet-baseline.json"
exclude  = ["**/_vendored/**"]

# [docs_ratchet] -- the scaffold's baseline-and-ratchet on docs hygiene. The gate
# (scripts/verify-before-ship.ps1) runs scripts/docs_ratchet_gate.py, which wraps
# scripts/docs_ratchet.py: it fails when the root README.md grows past 40 KiB or
# past its baselined size, or when README.md or docs/**/*.md gains a history marker
# (an issue reference, a dated heading, a changelog heading) beyond
# .docs-ratchet-baseline.json. Docs state the present-tense why; history lives in
# git, PRs and issues. A doc that cannot be read exits 3, which fails the gate.
# No exclude: docs/ holds no generated or dated report folder. Procedure +
# limits: project-scaffolding docs/docs-ratchet.md.
[docs_ratchet]
enabled  = true
baseline = ".docs-ratchet-baseline.json"

# [structure_ratchet] -- the scaffold's baseline-and-ratchet on repo structure. The gate
# (scripts/verify-before-ship.ps1) runs scripts/structure_ratchet.py: it fails when a
# file passes 1,000 lines, a Python/JS function 100 lines, a directory 40 modules, or a
# src/ module imports app/, beyond .structure-ratchet-baseline.json, or when a tracked
# root folder is outside the `shape` preset and `extra_roots` above (never baselined;
# docs/layout.md says why each exception stays). Stdlib only. A file that cannot be
# measured exits 3, which fails the gate. Vendored copies are excluded by the script
# itself. Procedure + limits: project-scaffolding docs/structure-ratchet.md.
[structure_ratchet]
enabled  = true
baseline = ".structure-ratchet-baseline.json"

# [conventions_ratchet] -- the scaffold's baseline-and-ratchet on fleet conventions held as
# stdlib ast rules. The gate (scripts/verify-before-ship.ps1) runs
# scripts/conventions_ratchet.py: it fails when a file's hit count for an enabled rule
# rises above .conventions-ratchet-baseline.json. no-window: this app runs on Windows
# with no console of its own (tray, webapp), so an unsuppressed spawn flashes a window.
# logging-not-print: app/ and src/ are library code. no-drive-path: no hardcoded drive
# locations. secret-compare and git-wrapper stay off: the repo has no helper for either.
# A file that cannot be parsed exits 3, which fails the gate. Vendored copies are skipped
# by the script itself. Procedure + limits: project-scaffolding docs/conventions-ratchet.md.
[conventions_ratchet]
enabled  = true
baseline = ".conventions-ratchet-baseline.json"
rules    = ["no-window", "logging-not-print", "no-drive-path"]

# [comment_ratchet] -- the scaffold's baseline-and-ratchet on issue references in comments. The gate
# (scripts/verify-before-ship.ps1) runs scripts/comment_ratchet.py: it fails when a file's
# count of #NNN references inside product-code comments (.py, .js, .css, .ps1) rises above
# .comment-ratchet-baseline.json. A comment states the present-tense why; history lives in
# the issue, the PR and git log. Tests are out of scope. _vendored/ is excluded because
# icons.js is vendor-verbatim but not declared in [vendored], so the script cannot skip it
# itself. A file that cannot be scanned exits 3, which fails the gate.
# Procedure + limits: project-scaffolding docs/comment-ratchet.md.
[comment_ratchet]
enabled  = true
baseline = ".comment-ratchet-baseline.json"
include  = ["app/", "src/", "scripts/"]
exclude  = ["**/_vendored/**"]

# [docstring_ratchet] -- repo-local baseline-and-ratchet on issue references inside Python
# docstrings (photo-ocr#266), closing the blind spot comment_ratchet.py's own docstring
# exclusion leaves open. The gate (scripts/verify-before-ship.ps1) runs
# scripts/docstring_ratchet.py: it fails when a file's count of #NNN references inside a
# module/class/function docstring rises above .docstring-ratchet-baseline.json. Not vendored:
# the real fix belongs in project-scaffolding's comment_ratchet.py; this stands in for
# photo-ocr until that lands. A file that cannot be read or parsed exits 3, which fails the gate.
[docstring_ratchet]
enabled  = true
baseline = ".docstring-ratchet-baseline.json"
include  = ["app/", "src/", "scripts/"]
exclude  = ["**/_vendored/**"]

# [instruction_ratchet] -- the scaffold's baseline-and-ratchet on the lint-tier rules of the
# fleet prompt audit, run over this repo's instruction files (CLAUDE.md, AGENTS.md). The gate
# (scripts/verify-before-ship.ps1) runs scripts/instruction_ratchet.py: it fails when a file's
# count for a rule rises above .instruction-ratchet-baseline.json, or a file passes its size
# cap. The repo ships no skills or rules folder, so skill_dirs is empty. A file it cannot read
# exits 3, which fails the gate. Procedure + limits: project-scaffolding
# docs/instruction-ratchet.md.
[instruction_ratchet]
enabled     = true
baseline    = ".instruction-ratchet-baseline.json"
skill_dirs  = []

# [doc_refs_ratchet] -- the scaffold's baseline-and-ratchet on stale references in docs. The gate
# (scripts/verify-before-ship.ps1) runs scripts/doc_refs_ratchet.py: it reads README.md,
# CLAUDE.md and docs/**/*.md, resolves every repo path, python -m module and loopback port
# against the tracked tree and this file, and fails on a dangling one that
# .doc-refs-ratchet-baseline.json does not record. allow_refs lists the ports of the other
# services the docs name: :8000 is the local LLM hub, :9221 the iOS WebKit debug proxy
# (docs/iphone-debugging.md). Procedure + limits: project-scaffolding docs/doc-refs-ratchet.md.
[doc_refs_ratchet]
enabled    = true
baseline   = ".doc-refs-ratchet-baseline.json"
allow_refs = [":8000", ":9221"]

# [dead_code_ratchet] -- the scaffold's baseline-and-ratchet on Python definitions nothing names.
# The gate (scripts/verify-before-ship.ps1) runs scripts/dead_code_ratchet.py: it fails on an
# unused function, class or variable in app/ and src/ that .dead-code-ratchet-baseline.json does
# not record. A name another file, a string or a non-Python source mentions counts as used.
# Procedure + limits: project-scaffolding docs/dead-code-ratchet.md.
[dead_code_ratchet]
enabled  = true
baseline = ".dead-code-ratchet-baseline.json"
include  = ["app/", "src/"]

# /design-sync verdicts the repo accepts (skills/_lib/design_lint/accepted.py).
# `detail` pins the exact lint message, so a second off-scale row raises the
# finding again.
[[design.accepted]]
check  = "row-height-scale"
detail = "row/action-rail heights outside the 44px, 52px, 60px scale: 48pxx1"
reason = "toolbar row sized to the 48px buttons at styles.css:542"
record = "https://github.com/ferraroroberto/photo-ocr/issues/214"

# /perf-review (fleet-config skills/perf-review): "ready" is the empty take's
# primary start, "Choose photos", visible on the Capture tab (the phone's
# landing view), not first contentful paint. Capture has no card that waits
# on live data (config and history only fill the Settings and History panes),
# so the affordance the user needs to start a take is the honest ready signal.
[perf.review]
ready_selector = ".choose-photos-btn"

# /design-review's e2e capture (tests/e2e/_surface.py) flips light/dark in place on an open
# surface; this app stamps html[data-theme] at load from photo-ocr.theme (else the OS
# scheme), so the hook has to set that key too or its dark shots stay light.
[design.review]
theme_storage_key = "photo-ocr.theme"

# `measure --e2e` and `--synthetic` walk this throwaway webapp (empty History, temp
# data dir), never the live tray on :8444 (scripts/design_review_synthetic.py).
[design.review.synthetic]
command = ["scripts/design_review_synthetic.py"]
startup_timeout_s = 60

# Diff-proportionate e2e routing (project-scaffolding docs/e2e-routing.md).
# `scripts/classify_e2e.py` maps this branch's changed files to a tier; rules
# are tried in declaration order, first match wins. Only plainly inert paths
# get a "none" rule -- anything unmatched fail-safes to the full suite by
# construction, so leaving a path out is always the safe choice. Keep this
# table current in the same PR as any new e2e-relevant directory, and mirror
# each rule with a representative assertion in tests/test_classify_e2e.py.
[e2e]
static_pytest_target = "tests/e2e/test_smoke.py"
static_browsers = ["chromium"]
full_pytest_target = "tests/e2e"
# JUnit XML the pre-ship gate writes (timing source for /e2e-audit).
junit_xml = "webapp/e2e-junit.xml"

# --- inert: no browser surface at all -------------------------------------
[[e2e.rule]]
tier = "none"
prefix = "docs/"
label = "docs"

[[e2e.rule]]
tier = "none"
extensions = ["md"]
label = "markdown"

[[e2e.rule]]
tier = "none"
path = "LICENSE"
label = "license"

# The ratchet baseline is data for scripts/static_ratchet.py, not a browser surface.
[[e2e.rule]]
tier = "none"
path = ".static-ratchet-baseline.json"
label = "static-ratchet-baseline"

# Likewise data for scripts/docs_ratchet.py.
[[e2e.rule]]
tier = "none"
path = ".docs-ratchet-baseline.json"
label = "docs-ratchet-baseline"

# Likewise data for scripts/structure_ratchet.py.
[[e2e.rule]]
tier = "none"
path = ".structure-ratchet-baseline.json"
label = "structure-ratchet-baseline"

# Likewise data for scripts/conventions_ratchet.py.
[[e2e.rule]]
tier = "none"
path = ".conventions-ratchet-baseline.json"
label = "conventions-ratchet-baseline"

# Likewise data for scripts/comment_ratchet.py.
[[e2e.rule]]
tier = "none"
path = ".comment-ratchet-baseline.json"
label = "comment-ratchet-baseline"

# Likewise data for scripts/docstring_ratchet.py.
[[e2e.rule]]
tier = "none"
path = ".docstring-ratchet-baseline.json"
label = "docstring-ratchet-baseline"

# Likewise data for scripts/instruction_ratchet.py.
[[e2e.rule]]
tier = "none"
path = ".instruction-ratchet-baseline.json"
label = "instruction-ratchet-baseline"

# Likewise data for scripts/doc_refs_ratchet.py.
[[e2e.rule]]
tier = "none"
path = ".doc-refs-ratchet-baseline.json"
label = "doc-refs-ratchet-baseline"

# Likewise data for scripts/dead_code_ratchet.py.
[[e2e.rule]]
tier = "none"
path = ".dead-code-ratchet-baseline.json"
label = "dead-code-ratchet-baseline"

# Desktop tray / Stream Deck icons -- never served to the browser.
[[e2e.rule]]
tier = "none"
prefix = "assets/"
label = "desktop-assets"

# --- narrow: served image assets, smoke slice is enough --------------------
[[e2e.rule]]
tier = "static"
prefix = "app/webapp/static/"
extensions = ["png", "ico", "jpg", "jpeg", "webp", "gif", "svg"]
label = "static-images"

# --- full: the rendered PWA and the modules behind it ----------------------
[[e2e.rule]]
tier = "full"
prefix = "app/webapp/"
label = "webapp"

[[e2e.rule]]
tier = "full"
prefix = "src/"
label = "webapp-facing-src"
