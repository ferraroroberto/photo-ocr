[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning:websockets.*
    ignore::DeprecationWarning:uvicorn.*
markers =
    smoke: end-to-end webapp boot tests (slow; require free port 8444)
    network: tests that hit local-llm-hub on :8000 (skipped if unreachable)
    windows_only: needs Windows-desktop state (PowerShell, the single-instance mutex, the proactor event loop); the Mac nightly deselects it with -m "not windows_only"
    desktop_only: e2e test that runs only on the Chromium-desktop projection (not WebKit/iPhone)
